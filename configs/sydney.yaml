# ============================================================
# CẤU HÌNH DỰ ÁN PHÂN TÍCH INSIDE AIRBNB - SYDNEY
# UET.DSE2049 - Nhóm 1 - Lớp UET.DSE2049 3
# Mã phân công: DSE2049-C03-G01-sydney
# ============================================================

# 1. THÔNG TIN THÀNH PHỐ & ĐƠN VỊ TIỀN TỆ
city: "Sydney"
city_name: "Sydney"
country: "Australia"
state: "NSW"
currency: "AUD"

# 2. ĐƯỜNG DẪN DỮ LIỆU & THƯ MỤC
data_root: "australia/nsw/sydney"
reports_dir: "reports"
figures_dir: "figures"
processed_dir: "data/processed"

# 3. BỐN MỐC CHỤP DỮ LIỆU (SNAPSHOTS)
snapshots:
  - "2025-09-12"
  - "2025-12-12"
  - "2026-03-21"
  - "2026-06-16"

# 4. THAM SỐ KIỂM SOÁT CHẤT LƯỢNG (QA) - CHUẨN HÓA BÀI GIẢNG 10 & ĐỀ BÀI
qa:
  outlier_method: "iqr_by_room_type"  # Phương pháp IQR theo từng loại phòng (Bài 10, slide 21-22)
  iqr_factor: 1.5                      # Hệ số khoảng tứ phân vị Tukey chuẩn: Q3 + 1.5 * IQR (Bài 10, slide 21)
  price_outlier_multiplier: 1.5        # Tương thích ngược với tên cấu hình cũ (V09)
  min_nights_cap: 365                  # Ngưỡng số đêm tối thiểu hợp lý (Bài 10, slide 18 & 34)
  dedupe_keys:                         # Khóa xác định trùng lặp nội bộ mốc (Bài 10, slide 26)
    - "id"
  impute_cols:                         # Cột điền trung vị theo nhóm room_type (Bài 10, slide 10-12)
    - "bedrooms"
    - "beds"
    - "review_scores_rating"
    - "reviews_per_month"

# 5. CẤU HÌNH BỘ CHỈ SỐ KPI
kpi:
  area_col: "neighbourhood_cleansed"  # Cột phân vùng địa lý chính

# 6. CẤU HÌNH MÔ HÌNH LLM (GEMINI API)
llm:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"
  temperature: 0.0
  sample_size: 1000
  max_api_calls: 1000   # Cho phép xử lý toàn bộ 1.000 review bằng LLM
  rate_limit_sleep: 0.1 # Tài khoản trả phí (Pay-as-you-go), gọi siêu tốc không cần chờ 4.1s
  sleep_seconds: 0.1    # Tương thích khóa cấu hình V09
  cache: "data/processed/llm_cache.jsonl"
  aspects:
    - "vị trí"
    - "sạch sẽ"
    - "chủ nhà"
    - "giá trị"
    - "tiện nghi"
    - "độ ồn"
    - "an toàn"
    - "giao thông"
  schema:
    aspects:
      - "vị trí"
      - "sạch sẽ"
      - "chủ nhà"
      - "giá trị"
      - "tiện nghi"
      - "độ ồn"
      - "an toàn"
      - "giao thông"

# 7. CẤU HÌNH ĐỐI CHỨNG (BASELINE) & RANDOM SEED
baseline:
  method: "heuristic"
  gold_labels_file: "data/samples/manual_labels_100.csv"

seed: 42
