# ============================================================
# CẤU HÌNH DỰ ÁN PHÂN TÍCH INSIDE AIRBNB - SYDNEY
# UET.DSE2049 - Nhóm 1 - Lớp UET.DSE2049 3
# Mã phân công: DSE2049-C03-G01-sydney
# ============================================================

# 1. THÔNG TIN THÀNH PHỐ & ĐƠN VỊ TIỀN TỆ
city: "Sydney"
city_name: "Sydney"
country: "Australia"
state: "NSW"
currency: "AUD"

# 2. ĐƯỜNG DẪN DỮ LIỆU & THƯ MỤC
data_root: "australia/nsw/sydney"
reports_dir: "reports"
figures_dir: "figures"
processed_dir: "data/processed"

# 3. BỐN MỐC CHỤP DỮ LIỆU (SNAPSHOTS)
snapshots:
  - "2025-09-12"
  - "2025-12-12"
  - "2026-03-21"
  - "2026-06-16"

# 4. THAM SỐ KIỂM SOÁT CHẤT LƯỢNG (QA)
qa:
  price_min: 10         # Giá thấp nhất hợp lệ (AUD/đêm)
  price_max: 10000      # Giá cao nhất hợp lệ (AUD/đêm)
  min_nights_cap: 365   # Ngưỡng số đêm tối thiểu hợp lý
  dedupe_keys:          # Bộ khóa xác định trùng lặp nội bộ mốc
    - "id"
    - "last_scraped"

# 5. CẤU HÌNH BỘ CHỈ SỐ KPI
kpi:
  area_col: "neighbourhood_cleansed"  # Cột phân vùng địa lý chính

# 6. CẤU HÌNH MÔ HÌNH LLM (GEMINI API)
llm:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"
  temperature: 0.0
  sample_size: 1000
  max_api_calls: 15     # Giới hạn an toàn tránh vượt quota
  cache: "data/processed/llm_cache.jsonl"
  aspects:
    - "vị trí"
    - "sạch sẽ"
    - "chủ nhà"
    - "giá trị"
    - "tiện nghi"
    - "độ ồn"
    - "an toàn"
    - "giao thông"

# 7. CẤU HÌNH ĐỐI CHỨNG (BASELINE) & RANDOM SEED
baseline:
  method: "heuristic"
  gold_labels_file: "data/samples/manual_labels_100.csv"

seed: 42
